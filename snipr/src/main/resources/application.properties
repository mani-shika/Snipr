
 

spring.datasource.url=jdbc:h2:file:./data/snipr
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
 

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
 
app.base-url=http://localhost:8080/

# Add these lines to application.properties

spring.data.redis.host=localhost
spring.data.redis.port=6379

# How long a cached entry lives before it's automatically evicted (1 hour).
# We'll reference this value in code via @Value.
app.cache-ttl-seconds=3600